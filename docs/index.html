<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Weekly Intelligence Brief — data-backed weekly analysis.">
  <title>Weekly Intelligence Brief</title>
  <style>
    :root { --ink:#1d1d1b; --muted:#6f6f6b; --line:#deded8; --link:#24587a; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:#fff; color:var(--ink); font-family:Georgia,"Times New Roman",serif; }
    main { width:min(900px,calc(100% - 40px)); margin:0 auto; padding:30px 0 72px; }
    header { display:flex; justify-content:space-between; gap:20px; padding-bottom:16px; border-bottom:1px solid var(--line); color:var(--muted); font:12px/1.4 Arial,sans-serif; }
    .wordmark { color:var(--ink); font-weight:700; text-decoration:none; }
    #toc { margin:0 0 12px; padding:22px 0 24px; border-bottom:1px solid var(--line); }
    #toc h2 { margin:0 0 12px; color:var(--muted); font:600 11px/1.2 Arial,sans-serif; letter-spacing:.08em; }
    #toc ul { columns:2; gap:28px; margin:0; padding:0; list-style:none; }
    #toc li { margin:0 0 7px; font:14px/1.35 Arial,sans-serif; }
    #toc a { color:var(--ink); text-decoration:none; }
    #toc a:hover { text-decoration:underline; text-underline-offset:3px; }
    article { padding-top:30px; }
    h1 { margin:0 0 12px; font-size:38px; font-weight:500; letter-spacing:-.035em; }
    h2 { margin:0; padding:34px 0 17px; border-top:1px solid var(--line); font-size:26px; font-weight:500; letter-spacing:-.025em; }
    h3 { margin:24px 0 7px; font:600 13px/1.2 Arial,sans-serif; }
    p, li { font-size:17px; line-height:1.58; }
    p { margin:0 0 12px; }
    ul, ol { margin:0 0 14px; padding-left:23px; }
    li { margin:0 0 7px; }
    a { color:var(--link); text-decoration:underline; text-underline-offset:2px; }
    em { color:var(--muted); font-size:15px; }
    table { width:100%; margin:4px 0 18px; border-collapse:collapse; font-family:Arial,sans-serif; font-size:14px; }
    th, td { padding:11px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; line-height:1.45; }
    th { color:var(--muted); font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
    .visual { margin:24px 0 30px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .visual svg { display:block; width:100%; height:auto; }
    .visual figcaption { margin-top:9px; color:var(--muted); font:12px/1.45 Arial,sans-serif; }
    .error { color:#9b2c2c; font-family:Arial,sans-serif; }
    @media (max-width:600px) { main { width:min(100% - 30px,900px); padding-top:20px; } header { display:block; line-height:1.7; } #toc ul { columns:1; } h1 { font-size:31px; } h2 { font-size:24px; } p,li { font-size:16px; } table { display:block; overflow-x:auto; } }
  </style>
</head>
<body>
  <main>
    <header><a class="wordmark" href="./">Weekly Intelligence Brief</a><span>signal &gt; noise</span></header>
    <nav id="toc" aria-label="Содержание" hidden><h2>Содержание</h2><ul></ul></nav>
    <article id="brief" aria-live="polite"><p>Загрузка выпуска…</p></article>
  </main>
  <script>
    const escapeHtml = value => value.replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    const inline = value => escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    const slug = value => value.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-zа-яё0-9]+/gi, "-").replace(/^-|-$/g, "");
    function visual(name) {
      if (name === "monetary-conditions") return `<figure class="visual"><svg viewBox="0 0 760 210" role="img" aria-labelledby="monetary-title monetary-desc"><title id="monetary-title">Денежные условия России</title><desc id="monetary-desc">Недельный ИПЦ плюс 0,02 процента, бизнес-климат минус 2,3 пункта и рост широкой денежной массы М2Х 12,6 процента год к году.</desc><text x="0" y="18" font-family="Arial" font-size="12" fill="#6f6f6b">РОССИЯ: ЦЕНЫ, БИЗНЕС-КЛИМАТ И ДЕНЕЖНЫЙ ИМПУЛЬС</text><line x1="0" y1="190" x2="760" y2="190" stroke="#deded8"/><text x="0" y="55" font-family="Arial" font-size="14" fill="#1d1d1b">Недельный ИПЦ</text><text x="0" y="83" font-family="Georgia" font-size="30" fill="#1d1d1b">+0,02%</text><line x1="0" y1="104" x2="145" y2="104" stroke="#1d1d1b" stroke-width="2"/><text x="0" y="135" font-family="Arial" font-size="12" fill="#6f6f6b">8–14 сентября</text><text x="255" y="55" font-family="Arial" font-size="14" fill="#1d1d1b">Бизнес-климат</text><text x="255" y="83" font-family="Georgia" font-size="30" fill="#1d1d1b">−2,3 п.</text><line x1="255" y1="104" x2="505" y2="104" stroke="#1d1d1b" stroke-width="2"/><text x="255" y="135" font-family="Arial" font-size="12" fill="#6f6f6b">сентябрь · ЦБ</text><text x="565" y="55" font-family="Arial" font-size="14" fill="#1d1d1b">М2Х</text><text x="565" y="83" font-family="Georgia" font-size="30" fill="#1d1d1b">12,6%</text><line x1="565" y1="104" x2="760" y2="104" stroke="#1d1d1b" stroke-width="2"/><text x="565" y="135" font-family="Arial" font-size="12" fill="#6f6f6b">июль · г/г</text></svg><figcaption>Недельная инфляция вернулась к плюсу; ожидания улучшились, но неценовые условия кредита стали жёстче.</figcaption></figure>`;
      if (name === "ai-risk-chain") return `<figure class="visual"><svg viewBox="0 0 760 230" role="img" aria-labelledby="ai-chain-title ai-chain-desc"><title id="ai-chain-title">Цепочка AI-инфраструктуры и рисков</title><desc id="ai-chain-desc">Гарантия Nvidia поддерживает строительство дата-центра SB Energy, создаёт мощности OpenAI и спрос на GPU; риски лежат в финансировании, энергии, контрагенте и загрузке.</desc><text x="0" y="18" font-family="Arial" font-size="12" fill="#6f6f6b">AI-ИНФРАСТРУКТУРА: ГДЕ ВОЗНИКАЕТ РИСК</text><g font-family="Arial" font-size="13" fill="#1d1d1b" text-anchor="middle"><rect x="0" y="52" width="145" height="48" fill="none" stroke="#1d1d1b"/><text x="72" y="73">Гарантия</text><text x="72" y="89">Nvidia</text><rect x="205" y="52" width="145" height="48" fill="none" stroke="#1d1d1b"/><text x="277" y="73">Стройка</text><text x="277" y="89">SB Energy</text><rect x="410" y="52" width="145" height="48" fill="none" stroke="#1d1d1b"/><text x="482" y="73">Мощности</text><text x="482" y="89">OpenAI</text><rect x="615" y="52" width="145" height="48" fill="none" stroke="#1d1d1b"/><text x="687" y="73">Спрос на</text><text x="687" y="89">GPU</text></g><g stroke="#24587a" stroke-width="1.5" fill="none"><path d="M145 76h50m-8-5 8 5-8 5"/><path d="M350 76h50m-8-5 8 5-8 5"/><path d="M555 76h50m-8-5 8 5-8 5"/></g><line x1="0" y1="147" x2="760" y2="147" stroke="#deded8"/><text x="0" y="177" font-family="Arial" font-size="12" fill="#6f6f6b">РИСКИ, КОТОРЫЕ НУЖНО ПРОВЕРЯТЬ</text><g font-family="Arial" font-size="14" fill="#1d1d1b"><text x="0" y="207">контрагент</text><text x="195" y="207">финансирование</text><text x="410" y="207">энергия</text><text x="625" y="207">загрузка</text></g></svg><figcaption>Из продажи оборудования история переходит в кредитный и проектно-финансовый анализ.</figcaption></figure>`;
      return "";
    }
    function render(markdown) {
      const lines = markdown.split(/\r?\n/); let html = "", i = 0, list = null;
      const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
      while (i < lines.length) {
        const line = lines[i]; const tableRule = /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || "");
        const visualMarker = /^:::visual\s+([a-z-]+)\s*$/.exec(line);
        if (visualMarker) { closeList(); html += visual(visualMarker[1]); i++; continue; }
        if (/^\|/.test(line) && tableRule) {
          closeList(); const rows = []; const parseRow = row => row.trim().replace(/^\||\|$/g, "").split("|").map(cell => inline(cell.trim()));
          const header = parseRow(line); i += 2; while (i < lines.length && /^\|/.test(lines[i])) rows.push(parseRow(lines[i++]));
          html += `<table><thead><tr>${header.map(cell => `<th>${cell}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`; continue;
        }
        const heading = /^(#{1,3})\s+(.+)$/.exec(line);
        if (heading) { closeList(); const level = heading[1].length; const text = inline(heading[2]); const id = level > 1 ? slug(heading[2]) : ""; html += `<h${level}${id ? ` id="${id}"` : ""}>${text}</h${level}>`; i++; continue; }
        const bullet = /^-\s+(.+)$/.exec(line); const ordered = /^\d+\.\s+(.+)$/.exec(line);
        if (bullet || ordered) { const type = bullet ? "ul" : "ol"; if (list !== type) { closeList(); html += `<${type}>`; list = type; } html += `<li>${inline((bullet || ordered)[1])}</li>`; i++; continue; }
        if (!line.trim()) { closeList(); i++; continue; }
        closeList(); html += `<p>${inline(line)}</p>`; i++;
      }
      closeList(); return html;
    }
    fetch("./current.md").then(response => { if (!response.ok) throw new Error("Не удалось загрузить выпуск"); return response.text(); }).then(markdown => {
      const brief = document.querySelector("#brief"); brief.innerHTML = render(markdown);
      const headings = [...brief.querySelectorAll("h2")]; const toc = document.querySelector("#toc"); const list = toc.querySelector("ul");
      list.innerHTML = headings.map(heading => `<li><a href="#${heading.id}">${heading.textContent}</a></li>`).join(""); toc.hidden = !headings.length;
    }).catch(error => { document.querySelector("#brief").innerHTML = `<p class="error">${error.message}</p>`; });
  </script>
</body>
</html>
